<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Angelo Pomasongo">
    <title>Discord - Registro</title>
</head>

<body>
    <form action="/registro" method="post">
        <h1>Crear una cuenta de Discord</h1>
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
        </div>
        <br>
        <div>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" placeholder="Ingresa tu apellido" required>
        </div>
        <br>
        <div>
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>
        </div>
        <br>
        <div>
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>
        </div>
        <br>
        <div>
            <label for="confirmar_contrasena">Confirmar Contraseña:</label>
            <input type="password" id="confirmar_contrasena" name="confirmar_contrasena"
                placeholder="Confirma tu contraseña" required>
        </div>
        <br>
        <div>
            <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
        </div>
        <br>
        <fieldset>
            <legend>Género:</legend>
            <input type="radio" name="genero" id="masculino" value="masculino">
            <label for="masculino">Masculino</label>
            <input type="radio" name="genero" id="femenino" value="femenino">
            <label for="femenino">Femenino</label>
            <input type="radio" name="genero" id="prefiero" value="prefiero_no_decirlo">
            <label for="prefiero">Prefiero no decirlo</label>
        </fieldset>
        <br>
        <div>
            <label for="comentario">Comentario sobre ti:</label>
            <br>
            <textarea id="comentario" name="comentario" rows="4" cols="30"
                placeholder="Escribe un breve comentario..."></textarea>
        </div>
        <br>
        <div>
            <label for="intereses">Seleccionar tus intereses:</label><br>
            <select id="intereses" name="intereses">
                <option value="musica">Música</option>
                <option value="pelicula">Película</option>
                <option value="deportes">Deportes</option>
                <option value="tecnologia">Tecnología</option>
            </select>
        </div>
        <br>
        <div>
            <input type="checkbox" id="acepto" name="acepto" required>
            <label for="acepto">Al registrarse aceptas los <a href="#">Términos y condiciones</a> de Discord</label>
        </div>
        <br>
        <div>
            <input type="submit" value="Registrarse">
        </div>
    </form>
</body>

</html>
