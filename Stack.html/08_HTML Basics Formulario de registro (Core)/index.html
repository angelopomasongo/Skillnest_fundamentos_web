<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
</head>

<body>
    <form action="/regristro" method="post">
        <h1>Crear una cuenta de Discord</h1>
        <div>
            <label for="Nombre">Nombre:</label>
            <input type="text" id="Nombre" name="Nombre" placeholder="Ingresa_tu_Nombre"> </div>
        <br><br>
        <div>
            <label for="Apellido">Apellido:</label>
            <input type="text" id="Apellido" name="Apellido" placeholder="Ingresar_tu_Apellido"> </div>
        <br><br>
        <div>
            <label for="Correo">Correo_Electronico:</label>
            <input type="text" id="Correo" name="Correo" placeholder="Ingresa_tu_Correo" ></div>   
        <br><br>
        <div>
            <label for="Contraseña">Contraseña:</label>
            <input type="password" id="Contraseña" name="Contraseña" placeholder="Ingresa_tu_contraseña ">
        </div>
        <br><br>
        <div>
            <label for="Contraseña">Confirmar Contraseña:</label>
            <input type="password" id="Confirmar_Contraseña" name="Confirmar_Contraseña" placeholder="Ingresa_tu_contraseña ">
        </div>
        <br><br>
        <div>
            <label for="Fecha_de_Nacimiento">Fecha de Nacimiento</label>
            <input type="date" id="Fecha_de_Nacimiento" name="Fecha_de_Nacimiento">
        </div>
        <br><br>
        <div>
            <label>Genero:</label>
            <input type="radio" name="Genero" id="Masculino" ><label for="Masculino">Masculino</label>
            <input type="radio" name="Genero" id="Femenino"><label for="Femenino">Femenino</label>
            <input type="radio" name="Genero" id="Prefiero"><label for="Prefiero">Prefiero no decirlo</label>
        </div>
        <br><br>
        <div>
            <label for="comentario">Comentario Sobre ti:</label>
            <br>
        <textarea
            id="comentario"
            name="comentario"
            rows="4"
            cols="30"
        ></textarea>
        </div>
        <div>
            <label>Seleccionar tus intereses</label><br>
            <select id="Seleccionar" name="Seleccionar">
                <option value="Musica">Musica</option>
                <option value="Pelicula">Pelicula</option>
                <option value="Deportes">Deportes</option>
                <option value="Tecnologia">Tecnologia</option>
        </select><br><br>
        </div>
        <div>
            <input type="checkbox" id="acepto" name="acepto">
            <label for="acepto">Al regristrarse aceptas los <a href="#">Terminos y condiciones</a> de Discord </label><br><br>

        </div>
        <div>
            <input type="submit" value="regristrarse">
        </div>
    </form>

</body>

</html>
